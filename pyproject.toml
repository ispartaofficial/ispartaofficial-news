[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "isparta-official"
version = "0.1.0"
description = "IspartaOfficial bağımsız kaynak araştırması ve içerik kartı hazırlığı"
requires-python = ">=3.11"
dependencies = ["Pillow>=11,<13", "requests>=2.32,<3", "beautifulsoup4>=4.12,<5", "tzdata>=2025.1", "cryptography>=46,<48"]

[project.optional-dependencies]
test = ["pytest>=8,<10", "PyYAML>=6,<7"]
visual = ["transformers==4.57.1", "numpy>=2,<3"]

[tool.setuptools.packages.find]
include = ["isparta*", "news_engine*"]

[tool.setuptools.package-data]
isparta = ["assets/*.jpg", "assets/*.png"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

