name: Check Isparta Instagram connection (GET only)
on:
  workflow_dispatch:
    inputs:
      auth_mode:
        description: Independent Isparta authorization route; never borrow another account's token
        type: choice
        options: [instagram_login, facebook_login]
        default: instagram_login
permissions:
  contents: read
concurrency:
  group: isparta-connection-read-only
  cancel-in-progress: false
jobs:
  check:
    if: github.repository == 'ispartaofficial/ispartaofficial-news' && github.ref == 'refs/heads/main' && vars.META_CONNECTION_CHECK_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: instagram-production
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: main
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python -m pip install -e .
      - name: Verify the existing Isparta account and quota without publishing
        env:
          INSTAGRAM_AUTH_MODE: ${{ inputs.auth_mode }}
          META_GRAPH_VERSION: ${{ vars.META_GRAPH_VERSION || 'v26.0' }}
          INSTAGRAM_USER_ID: ${{ secrets.INSTAGRAM_USER_ID }}
          INSTAGRAM_ACCESS_TOKEN: ${{ secrets.INSTAGRAM_ACCESS_TOKEN }}
          INSTAGRAM_PUBLISH_ENABLED: 'false'
          FACEBOOK_PUBLISH_ENABLED: 'false'
        run: python -m news_engine.connection_health
