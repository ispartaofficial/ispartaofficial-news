name: Research and prepare Isparta content
on:
  push:
    branches: [main]
    paths: ['isparta/**', 'news_engine/**', 'config/**', 'site/**', '.github/workflows/research.yml']
  workflow_dispatch:
    inputs:
      first_post_id:
        description: Optional reviewed first launch parent; refused after any different claim
        required: false
        type: string
        default: ""
  schedule:
    # Europe/Istanbul: 07:20–23:50, twice hourly. GitHub may start later.
    - cron: '20,50 4-20 * * *'
permissions:
  contents: read
concurrency:
  group: isparta-production
  cancel-in-progress: false
jobs:
  research:
    if: github.repository == 'ispartaofficial/ispartaofficial-news' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write # Only the isolated automation-state branch is written.
    env:
      PUBLICATION_AUTHORIZED: ${{ vars.INSTAGRAM_PUBLISH_ENABLED == 'true' && vars.META_TESTS_COMPLETED == 'true' && 'true' || 'false' }}
      INSTAGRAM_PUBLISH_ENABLED: 'false'
      ILLUSTRATIONS_ENABLED: 'false' # Only the explicit preparation-step opt-in can override this.
      SOURCE_PHOTOS_ENABLED: 'true'
      VISUAL_MODEL_DIR: work/visual-model
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python -m pip install -e .
      - name: Install local fonts and Turkish/English image lettering check
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends fonts-dejavu-core tesseract-ocr tesseract-ocr-tur
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: work/visual-model
          key: isparta-clip-cpu-3d74acf9a28c67741b2f4f2ea7635f0aaf6f0268
      - name: Set up pinned local image subject model; unavailable means information cards
        continue-on-error: true
        timeout-minutes: 4
        run: |
          python -m pip install torch==2.14.1 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -e '.[visual]'
          python -m news_engine.visual_match --download
          python - <<'PY'
          from news_engine.image_safety import ocr_available
          from news_engine.visual_match import runtime
          if not ocr_available():
              raise SystemExit('Turkish/English OCR unavailable; source photos remain unapproved')
          runtime()
          print('Local image subject and lettering checks ready; no generation API used')
          PY
      - name: Restore independent durable history; never reset on failure
        id: restore
        run: python -m news_engine.state_git restore
      - name: Read full sources and prepare verified news, weather and pharmacy cards
        env:
          # Independent Isparta credentials only. Missing opt-in/credentials stays closed.
          ILLUSTRATIONS_ENABLED: ${{ vars.ILLUSTRATIONS_ENABLED == 'true' && 'true' || 'false' }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: python -m isparta.runtime prepare --report state/research.json
      - name: Persist safe state before deploying prepared cards
        if: always() && steps.restore.outcome == 'success'
        env:
          STATE_WRITE_TOKEN: ${{ github.token }}
        run: python -m news_engine.state_git persist
      - name: Validate public panel and media
        run: python -m news_engine.security public dist
      - name: Save bounded research evidence without social credentials
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: isparta-research-${{ github.run_id }}
          path: state/research.json
          if-no-files-found: error
          retention-days: 14
      - name: Package verified panel and JPEGs
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa
        with:
          path: dist
  deploy:
    needs: research
    if: github.repository == 'ispartaofficial/ispartaofficial-news' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b
        with:
          enablement: true
      - uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e
        id: deployment
  publish:
    needs: deploy
    if: github.repository == 'ispartaofficial/ispartaofficial-news' && github.ref == 'refs/heads/main' && vars.INSTAGRAM_PUBLISH_ENABLED == 'true' && vars.META_TESTS_COMPLETED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    permissions:
      contents: write
    environment: instagram-production
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python -m pip install -e .
      - name: Restore the same independent state
        id: restore
        run: python -m news_engine.state_git restore
      - name: Publish only with independent configuration and verified account identity
        env:
          STATE_WRITE_TOKEN: ${{ github.token }}
          INITIAL_POST_ID: ${{ github.event_name == 'workflow_dispatch' && inputs.first_post_id || '' }}
          INSTAGRAM_PUBLISH_ENABLED: ${{ vars.INSTAGRAM_PUBLISH_ENABLED }}
          META_TESTS_COMPLETED: ${{ vars.META_TESTS_COMPLETED }}
          INSTAGRAM_AUTH_MODE: ${{ vars.INSTAGRAM_AUTH_MODE || 'instagram_login' }}
          META_GRAPH_VERSION: ${{ vars.META_GRAPH_VERSION || 'v26.0' }}
          INSTAGRAM_USER_ID: ${{ secrets.INSTAGRAM_USER_ID }}
          INSTAGRAM_ACCESS_TOKEN: ${{ secrets.INSTAGRAM_ACCESS_TOKEN }}
        run: python -m isparta.production publish
      - name: Preserve the final outcome, including uncertain claims
        if: always() && steps.restore.outcome == 'success'
        env:
          STATE_WRITE_TOKEN: ${{ github.token }}
        run: python -m news_engine.state_git persist
