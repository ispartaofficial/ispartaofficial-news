name: Research Isparta sources
on:
  workflow_dispatch:
  schedule:
    # Europe/Istanbul: 07:20, 09:20, ... 23:20. GitHub may start later.
    - cron: '20 4-20/2 * * *'
permissions:
  contents: read
concurrency:
  group: isparta-research
  cancel-in-progress: false
jobs:
  research:
    if: github.repository == 'ispartaofficial/ispartaofficial-news' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python -m pip install -e .
      - name: Read reviewed sources and check dates, places and participation
        run: python -m isparta.research --output state/research.json
      - name: Save research evidence without social credentials
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: isparta-research-${{ github.run_id }}
          path: state/research.json
          if-no-files-found: error
          retention-days: 14
