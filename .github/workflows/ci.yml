name: Validate Isparta readers and cards
on:
  pull_request:
  push:
    branches: [main, 'codex/**']
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends fonts-dejavu-core
      - run: python -m pip install -e '.[test]'
      - run: python -m pytest -q


  visual-runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
          cache: pip
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: work/visual-model
          key: clip-cpu-3d74acf9a28c67741b2f4f2ea7635f0aaf6f0268
      - run: python -m pip install torch==2.14.1 --index-url https://download.pytorch.org/whl/cpu
      - run: python -m pip install -e '.[test,visual]'
      - run: python -m news_engine.visual_match --download
      - run: sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends tesseract-ocr tesseract-ocr-tur
      - name: Actual model regression on reviewed photo crops
        env:
          RUN_VISUAL_NATIVE: 'true'
        run: python -m pytest -q tests/test_editorial_stock_native.py

