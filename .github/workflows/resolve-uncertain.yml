name: Resolve uncertain Instagram claims (manual, GET only)
on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: Report only; set false to write the closures to durable state
        type: boolean
        default: true
      post_id:
        description: Optional single claim (24 hex characters); empty means every open claim
        type: string
        required: false
        default: ""
permissions:
  contents: read
jobs:
  resolve:
    if: github.repository == 'ispartaofficial/ispartaofficial-news' && github.ref == 'refs/heads/main'
    # Writing shares the production lock with research/publish, weather and
    # pharmacy. A report-only run takes its own lock so it never displaces a
    # pending production job.
    concurrency:
      group: ${{ inputs.dry_run && 'isparta-resolve-report' || 'isparta-production' }}
      cancel-in-progress: false
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: instagram-production
    permissions:
      contents: write # Only the isolated automation-state branch, and only when dry_run is false.
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: main
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python -m pip install -e .
      - name: Restore the same independent state
        id: restore
        run: python -m news_engine.state_git restore
      - name: Read container status of open claims; never publish
        env:
          DRY_RUN: ${{ inputs.dry_run }}
          POST_ID: ${{ inputs.post_id }}
          INSTAGRAM_PUBLISH_ENABLED: 'false'
          FACEBOOK_PUBLISH_ENABLED: 'false'
          INSTAGRAM_AUTH_MODE: ${{ vars.INSTAGRAM_AUTH_MODE || 'instagram_login' }}
          META_GRAPH_VERSION: ${{ vars.META_GRAPH_VERSION || 'v26.0' }}
          INSTAGRAM_USER_ID: ${{ secrets.INSTAGRAM_USER_ID }}
          INSTAGRAM_ACCESS_TOKEN: ${{ secrets.INSTAGRAM_ACCESS_TOKEN }}
        run: |
          args=(resolve-uncertain)
          if [ "$DRY_RUN" = "false" ]; then args+=(--apply); fi
          if [ -n "$POST_ID" ]; then args+=(--post-id "$POST_ID"); fi
          python -m isparta.production "${args[@]}"
      - name: Persist the closures through the usual state writer
        if: always() && steps.restore.outcome == 'success' && inputs.dry_run == false
        env:
          STATE_WRITE_TOKEN: ${{ github.token }}
        run: python -m news_engine.state_git persist
